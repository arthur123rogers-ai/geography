<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sconnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #6366f1;
      --accent-hover: #4f46e5;
      --accent-muted: rgba(99,102,241,.12);
      --sidebar:      #111114;
      --sidebar-2:    #1c1c20;
      --sidebar-line: rgba(255,255,255,.07);
      --sidebar-text: #9ca3af;
      --sidebar-hi:   #ffffff;
      --nav-bg:       #ffffff;
      --page-bg:      #f5f5f7;
      --canvas:       #ffffff;
      --ink:          #09090b;
      --ink-2:        #52525b;
      --ink-3:        #a1a1aa;
      --line:         #e4e4e7;
      --fill:         #f4f4f5;
      --green:        #22c55e;
      --red:          #ef4444;
      --r-sm:  6px;
      --r-md:  10px;
      --r-lg:  14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--page-bg);
      color: var(--ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Toast ─── */
    .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--ink); color: #fff;
      padding: 10px 16px; border-radius: var(--r-md);
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
      animation: toastIn .2s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.success .t-dot { background: var(--green); }
    .toast.error   .t-dot { background: var(--red); }
    .t-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ─── Pages ─── */
    .page { display: none; }
    .page.active { display: flex; }
    .page.active#page-app { overflow: hidden; height: 100vh; flex-direction: column; }

    /* ─── Auth ─── */
    .auth-wrap {
      width: 100vw; min-height: 100vh; overflow-y: auto;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px; background: var(--page-bg);
    }
    .auth-card {
      width: 100%; max-width: 400px;
      background: var(--canvas); border-radius: 20px;
      border: 1px solid var(--line);
      padding: 40px 36px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06), 0 24px 64px rgba(0,0,0,.06);
    }
    .auth-logo {
      font-family: 'Syne'; font-size: 26px; font-weight: 800;
      text-align: center; margin-bottom: 4px; letter-spacing: -.5px;
    }
    .auth-logo span { color: var(--accent); }
    .auth-tagline { text-align: center; font-size: 13px; color: var(--ink-3); margin-bottom: 32px; }
    .auth-heading { font-size: 17px; font-weight: 600; margin-bottom: 20px; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; letter-spacing: .2px; }
    .field input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--line); border-radius: var(--r-md);
      font-size: 14px; font-family: inherit; color: var(--ink);
      background: var(--canvas); outline: none; transition: border-color .15s;
    }
    .field input:focus { border-color: var(--accent); }

    .role-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
    .role-btn {
      border: 1.5px solid var(--line); background: var(--fill);
      border-radius: var(--r-md); padding: 12px 6px;
      cursor: pointer; text-align: center; transition: all .15s;
      font-family: inherit;
    }
    .role-btn .re { display: block; font-size: 20px; margin-bottom: 4px; }
    .role-btn .rl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
    .role-btn:hover { border-color: var(--accent); background: var(--accent-muted); }
    .role-btn:hover .rl { color: var(--accent); }
    .role-btn.active { border-color: var(--accent); background: var(--accent-muted); }
    .role-btn.active .rl { color: var(--accent); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: none; cursor: pointer; font-family: inherit;
      font-size: 13px; font-weight: 600; border-radius: var(--r-md);
      padding: 10px 16px; transition: all .15s; outline: none;
    }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--ink-3); border: 1.5px solid var(--line); }
    .btn-ghost:hover { background: var(--fill); color: var(--ink); }
    .btn-red { background: var(--red); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-green:hover { background: #16a34a; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: var(--r-sm); }
    .btn-block { width: 100%; padding: 12px; }

    .or-row { display: flex; align-items: center; gap: 12px; margin: 14px 0; color: var(--ink-3); font-size: 12px; }
    .or-row::before, .or-row::after { content:''; flex:1; height:1px; background:var(--line); }

    /* ─── Nav ─── */
    .nav {
      height: 52px; background: var(--canvas);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; padding: 0 20px; gap: 12px;
      flex-shrink: 0;
    }
    .nav-logo { font-family: 'Syne'; font-size: 18px; font-weight: 800; letter-spacing: -.5px; flex-shrink: 0; }
    .nav-logo span { color: var(--accent); }
    .nav-spacer { flex: 1; }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent-muted); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; flex-shrink: 0;
    }
    .nav-user-name { font-size: 13px; font-weight: 600; color: var(--ink); }
    .nav-school-name { font-size: 12px; color: var(--ink-3); }

    /* ─── App body ─── */
    .app { display: flex; flex: 1; overflow: hidden; }

    /* ─── Sidebar ─── */
    .sidebar {
      width: 220px; background: var(--sidebar); flex-shrink: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-top {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--sidebar-line);
    }
    .sidebar-school {
      font-size: 13px; font-weight: 600; color: var(--sidebar-hi);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .sidebar-role {
      font-size: 11px; color: var(--sidebar-text);
      text-transform: uppercase; letter-spacing: .8px;
    }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 8px 6px; }
    .sidebar-body::-webkit-scrollbar { width: 0; }

    .s-label {
      padding: 12px 8px 4px;
      font-size: 10px; font-weight: 700; color: #4b5563;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .s-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; border-radius: var(--r-sm);
      cursor: pointer; transition: background .12s;
      font-size: 13px; color: var(--sidebar-text); font-weight: 500;
      margin-bottom: 1px;
    }
    .s-item .si { font-size: 14px; flex-shrink: 0; }
    .s-item:hover { background: rgba(255,255,255,.06); color: var(--sidebar-hi); }
    .s-item.active { background: rgba(99,102,241,.2); color: var(--sidebar-hi); }
    .s-divider { margin: 6px 8px; border: none; border-top: 1px solid var(--sidebar-line); }
    .s-add {
      display: flex; align-items: center; gap: 8px;
      margin: 4px 6px; padding: 8px 10px; border-radius: var(--r-sm);
      cursor: pointer; font-size: 13px; font-weight: 600;
      color: var(--green); transition: background .12s;
    }
    .s-add:hover { background: rgba(34,197,94,.1); }

    /* ─── Main ─── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--page-bg); }

    .main-bar {
      height: 52px; background: var(--canvas); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; padding: 0 24px; flex-shrink: 0;
      justify-content: space-between;
    }
    .main-bar h1 { font-size: 15px; font-weight: 600; }

    .main-body { flex: 1; overflow-y: auto; padding: 24px; }
    .main-body::-webkit-scrollbar { width: 6px; }
    .main-body::-webkit-scrollbar-track { background: transparent; }
    .main-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    .main-input-row {
      padding: 12px 16px; background: var(--canvas);
      border-top: 1px solid var(--line);
      display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    }
    .chat-input {
      flex: 1; padding: 9px 14px; border: 1.5px solid var(--line);
      border-radius: 999px; font-size: 13px; font-family: inherit;
      outline: none; transition: border-color .15s; background: var(--fill);
    }
    .chat-input:focus { border-color: var(--accent); background: var(--canvas); }

    /* ─── Cards ─── */
    .card {
      background: var(--canvas); border: 1px solid var(--line);
      border-radius: var(--r-lg); padding: 20px; margin-bottom: 12px;
    }

    /* ─── Section label ─── */
    .sec {
      font-size: 11px; font-weight: 700; color: var(--ink-3);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 12px; margin-top: 4px;
    }

    /* ─── Stats ─── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); gap: 10px; margin-bottom: 14px; }
    .stat {
      background: var(--canvas); border: 1px solid var(--line);
      border-radius: var(--r-md); padding: 16px 14px;
    }
    .stat-n { font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1; margin-bottom: 4px; }
    .stat-l { font-size: 12px; color: var(--ink-3); font-weight: 500; }

    /* ─── Greeting ─── */
    .greeting { margin-bottom: 20px; }
    .greeting h2 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 3px; }
    .greeting p { font-size: 13px; color: var(--ink-3); }

    /* ─── Code block ─── */
    .code-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--fill); border: 1px solid var(--line);
      border-radius: var(--r-md); padding: 12px 16px; margin-bottom: 14px;
    }
    .code-lbl { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .8px; }
    .code-val { font-family: 'Syne'; font-size: 17px; font-weight: 800; letter-spacing: 2.5px; color: var(--ink); flex: 1; }
    .code-copy {
      font-size: 12px; font-weight: 600; color: var(--accent);
      padding: 5px 10px; border-radius: var(--r-sm); border: 1.5px solid var(--accent);
      background: transparent; cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .code-copy:hover { background: var(--accent); color: #fff; }

    /* ─── Row items ─── */
    .row {
      display: flex; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--line);
      gap: 12px;
    }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .row:first-child { padding-top: 0; }
    .row-icon { font-size: 17px; width: 32px; text-align: center; flex-shrink: 0; }
    .row-body { flex: 1; min-width: 0; }
    .row-name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-meta { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
    .row-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* ─── Quick actions ─── */
    .qa-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .qa {
      display: flex; align-items: center; gap: 7px; padding: 9px 14px;
      background: var(--canvas); border: 1px solid var(--line);
      border-radius: var(--r-md); cursor: pointer; font-size: 13px; font-weight: 500;
      color: var(--ink-2); transition: all .12s;
    }
    .qa:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-muted); }

    /* ─── Chips ─── */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--fill); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 12px; font-weight: 500;
    }
    .chip-av {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent-muted); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
    }

    /* ─── Empty state ─── */
    .empty { text-align: center; padding: 32px 16px; }
    .empty-ico { font-size: 32px; margin-bottom: 10px; }
    .empty p { font-size: 13px; color: var(--ink-3); }

    /* ─── Chat ─── */
    .chat-body { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
    .chat-body::-webkit-scrollbar { width: 0; }
    .msg { display: flex; gap: 10px; }
    .msg.own { flex-direction: row-reverse; }
    .msg-av {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--fill); color: var(--ink-2);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 11px; flex-shrink: 0;
      align-self: flex-end; border: 1px solid var(--line);
    }
    .msg-col { display: flex; flex-direction: column; max-width: 60%; gap: 3px; }
    .msg.own .msg-col { align-items: flex-end; }
    .msg-sender { font-size: 11px; color: var(--ink-3); font-weight: 500; margin: 0 2px; }
    .msg-bub {
      background: var(--canvas); border: 1px solid var(--line);
      border-radius: 12px; border-bottom-left-radius: 3px;
      padding: 9px 13px; font-size: 13px; line-height: 1.5; color: var(--ink);
    }
    .msg.own .msg-bub {
      background: var(--accent); color: #fff; border: none;
      border-radius: 12px; border-bottom-right-radius: 3px;
    }
    .msg-time { font-size: 10px; color: var(--ink-3); margin: 0 2px; }
    .msg.own .msg-time { color: var(--ink-3); }

    @media (max-width: 768px) {
      .sidebar { width: 0; overflow: hidden; }
    }
  </style>
</head>
<body>

<div class="toast-wrap" id="toast-wrap"></div>

<!-- AUTH -->
<div id="page-auth" class="page active">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">S<span>connect</span></div>
      <p class="auth-tagline">Your school, connected.</p>

      <div id="auth-form">
        <p class="auth-heading">Sign in</p>
        <div class="field">
          <label>School code</label>
          <input id="code-input" type="text" placeholder="SCHOOL-0000" style="text-transform:uppercase;letter-spacing:2px;font-weight:700;" />
        </div>
        <div class="field">
          <label>Your name</label>
          <input id="name-input" type="text" placeholder="e.g. Alex Johnson" />
        </div>
        <div class="field">
          <label>Role</label>
          <div class="role-grid" id="role-grid">
            <button type="button" class="role-btn active" data-role="student"><span class="re">🎓</span><span class="rl">Student</span></button>
            <button type="button" class="role-btn" data-role="teacher"><span class="re">📚</span><span class="rl">Teacher</span></button>
            <button type="button" class="role-btn" data-role="admin"><span class="re">👑</span><span class="rl">Admin</span></button>
          </div>
        </div>
        <button type="button" id="btn-do-login" class="btn btn-accent btn-block">Join school</button>
        <div class="or-row">or</div>
        <button type="button" id="btn-show-signup" class="btn btn-ghost btn-block">Create a school</button>
      </div>

      <div id="signup-form" style="display:none;">
        <p class="auth-heading">Create a school</p>
        <div class="field">
          <label>Your name</label>
          <input id="signup-name" type="text" placeholder="e.g. Jane Smith" />
        </div>
        <div class="field">
          <label>School name</label>
          <input id="signup-school" type="text" placeholder="e.g. Lincoln High" />
        </div>
        <button type="button" id="btn-do-signup" class="btn btn-accent btn-block">Create school</button>
        <div class="or-row">or</div>
        <button type="button" id="btn-show-login" class="btn btn-ghost btn-block">Back to sign in</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="page-app" class="page">
  <nav class="nav">
    <div class="nav-logo">S<span>connect</span></div>
    <div class="nav-spacer"></div>
    <div class="nav-avatar" id="nav-avatar">?</div>
    <div>
      <div class="nav-user-name" id="nav-user-name"></div>
      <div class="nav-school-name" id="nav-school-name"></div>
    </div>
    <button type="button" id="btn-logout" class="btn btn-ghost btn-sm">Sign out</button>
  </nav>

  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-school" id="sidebar-school"></div>
        <div class="sidebar-role" id="sidebar-role"></div>
      </div>
      <div class="sidebar-body" id="sidebar-content"></div>
    </div>

    <div class="main">
      <div class="main-bar" id="main-header">
        <h1>Dashboard</h1>
      </div>
      <div class="main-body" id="main-content"></div>
      <div id="main-footer" style="display:none;" class="main-input-row">
        <input type="text" id="msg-input" class="chat-input" placeholder="Message…" />
        <button type="button" id="btn-send" class="btn btn-accent btn-sm">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const state = {
  currentUser: null, currentSchool: null, loginRole: 'student',
  view: 'home', viewData: null,
  schools: [], users: [], classes: [], groups: [], messages: {},
};

function $(id) { return document.getElementById(id); }

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = `<span class="t-dot"></span><span>${msg}</span>`;
  $('toast-wrap').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .2s'; setTimeout(()=>el.remove(),200); }, 2600);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function loadState() { try { const s=localStorage.getItem('sconnect'); if(s) Object.assign(state,JSON.parse(s)); } catch(e){} }
function saveState() { try { localStorage.setItem('sconnect',JSON.stringify(state)); } catch(e){} }

loadState();
window.addEventListener('load', () => { if (state.currentUser && state.currentSchool) gotoApp(); });

function showLogin() {
  $('auth-form').style.display = 'block';
  $('signup-form').style.display = 'none';
  setTimeout(() => $('code-input').focus(), 50);
}
function showSignup() {
  $('auth-form').style.display = 'none';
  $('signup-form').style.display = 'block';
  setTimeout(() => $('signup-name').focus(), 50);
}

function handleSignup() {
  const name = $('signup-name').value.trim();
  const school = $('signup-school').value.trim();
  if (!name || !school) { toast('Fill in both fields', 'error'); return; }
  const code = 'SCHOOL-' + Math.floor(1000 + Math.random() * 9000);
  const schoolObj = { id: 's'+Date.now(), code, name: school };
  const admin = { id: 'a'+Date.now(), schoolId: schoolObj.id, name, role: 'admin', avatar: name[0].toUpperCase() };
  state.schools.push(schoolObj); state.users.push(admin);
  state.currentSchool = schoolObj; state.currentUser = admin;
  saveState(); toast('School created — code: ' + code, 'success'); gotoApp();
}

function handleLogin() {
  const code = $('code-input').value.trim().toUpperCase();
  const name = $('name-input').value.trim();
  if (!code || !name) { toast('Code and name required', 'error'); return; }
  const school = state.schools.find(s => s.code === code);
  if (!school) { toast('School code not found', 'error'); return; }
  let user = state.users.find(u => u.schoolId===school.id && u.name===name && u.role===state.loginRole);
  if (!user) {
    user = { id: state.loginRole[0]+Date.now(), schoolId: school.id, name, role: state.loginRole, avatar: name[0].toUpperCase() };
    state.users.push(user);
  }
  state.currentUser = user; state.currentSchool = school;
  saveState(); toast('Welcome, '+user.name, 'success'); gotoApp();
}

function handleLogout() {
  state.currentUser = null; state.currentSchool = null; saveState();
  $('page-auth').classList.add('active');
  $('page-app').classList.remove('active');
  showLogin();
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => toast('Copied!', 'success'));
}

function gotoApp() {
  $('page-auth').classList.remove('active');
  $('page-app').classList.add('active');
  renderApp();
}

function renderApp() {
  const u = state.currentUser;
  $('nav-avatar').textContent = u.avatar;
  $('nav-user-name').textContent = u.name;
  $('nav-school-name').textContent = state.currentSchool.name;
  $('sidebar-school').textContent = state.currentSchool.name;
  $('sidebar-role').textContent = u.role;

  const sc = $('sidebar-content');
  let html = '';

  if (u.role === 'admin') {
    html = `
      <div class="s-item active" onclick="state.view='admin-home';renderContent()"><span class="si">⬡</span>Dashboard</div>
      <div class="s-item" onclick="state.view='admin-students';renderContent()"><span class="si">👥</span>Members</div>
      <div class="s-item" onclick="state.view='admin-classes';renderContent()"><span class="si">📚</span>Classes</div>
      <div class="s-item" onclick="state.view='admin-settings';renderContent()"><span class="si">⚙</span>Settings</div>
      <hr class="s-divider">
      <div class="s-add" onclick="createGeneralClass()">＋ New class</div>
    `;
  } else if (u.role === 'teacher') {
    const mine = state.classes.filter(c => c.schoolId===state.currentSchool.id && c.teacherId===u.id);
    html = `
      <div class="s-item active" onclick="state.view='teacher-home';renderContent()"><span class="si">⬡</span>Overview</div>
      ${mine.length ? `<div class="s-label">My classes</div>` + mine.map(c => `<div class="s-item" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()"><span class="si">${c.icon}</span>${escapeHtml(c.name)}</div>`).join('') : ''}
      <hr class="s-divider">
      <div class="s-add" onclick="createSpecificClass()">＋ New class</div>
    `;
  } else {
    const myGroups = state.groups.filter(g => g.schoolId===state.currentSchool.id && g.members.includes(u.id));
    const allC = state.classes.filter(c => c.schoolId===state.currentSchool.id);
    const general = allC.filter(c => c.type==='general');
    const mine = allC.filter(c => c.type==='specific' && c.students && c.students.includes(u.id));
    html = `
      <div class="s-item active" onclick="state.view='student-home';renderContent()"><span class="si">⬡</span>Dashboard</div>
      ${general.length ? `<div class="s-label">Year classes</div>` + general.map(c => `<div class="s-item" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()"><span class="si">${c.icon}</span>${escapeHtml(c.name)}</div>`).join('') : ''}
      ${mine.length ? `<div class="s-label">My classes</div>` + mine.map(c => `<div class="s-item" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()"><span class="si">${c.icon}</span>${escapeHtml(c.name)}</div>`).join('') : ''}
      ${myGroups.length ? `<div class="s-label">Groups</div>` + myGroups.map(g => `<div class="s-item" onclick="state.view='chat';state.viewData='group-${g.id}';renderContent()"><span class="si">${g.icon}</span>${escapeHtml(g.name)}</div>`).join('') : ''}
      <hr class="s-divider">
      <div class="s-add" onclick="createGroup()">＋ New group</div>
    `;
  }

  sc.innerHTML = html;
  sc.querySelectorAll('.s-item').forEach(item => {
    item.addEventListener('click', function() {
      sc.querySelectorAll('.s-item').forEach(i => i.classList.remove('active'));
      this.classList.add('active');
    });
  });
  renderContent();
}

function renderContent() {
  const u = state.currentUser;
  const content = $('main-content');
  const footer = $('main-footer');
  const hdr = $('main-header').querySelector('h1');
  let title = '', html = '', foot = 'none';

  if (!state.view || state.view === 'home')
    state.view = u.role==='admin' ? 'admin-home' : u.role==='teacher' ? 'teacher-home' : 'student-home';

  if (state.view === 'admin-home') {
    const all = state.users.filter(x => x.schoolId===state.currentSchool.id);
    const cls = state.classes.filter(c => c.schoolId===state.currentSchool.id);
    const grp = state.groups.filter(g => g.schoolId===state.currentSchool.id);
    title = 'Dashboard';
    html = `
      <div class="greeting"><h2>Good day, ${escapeHtml(u.name)}</h2><p>${escapeHtml(state.currentSchool.name)}</p></div>
      <div class="code-row">
        <div><div class="code-lbl">Join code</div><div class="code-val">${state.currentSchool.code}</div></div>
        <button class="code-copy" onclick="copyCode('${state.currentSchool.code}')">Copy</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-n">${all.length}</div><div class="stat-l">Members</div></div>
        <div class="stat"><div class="stat-n">${cls.length}</div><div class="stat-l">Classes</div></div>
        <div class="stat"><div class="stat-n">${grp.length}</div><div class="stat-l">Groups</div></div>
        <div class="stat"><div class="stat-n">${all.filter(x=>x.role==='student').length}</div><div class="stat-l">Students</div></div>
      </div>
      <div class="card">
        <div class="sec">Recent members</div>
        ${all.length ? `<div class="chips">${[...all].reverse().slice(0,10).map(x=>`<div class="chip"><div class="chip-av">${x.avatar}</div>${escapeHtml(x.name)}</div>`).join('')}</div>` : `<div class="empty"><div class="empty-ico">👥</div><p>No members yet — share the code above</p></div>`}
      </div>
      <div class="qa-grid">
        <div class="qa" onclick="state.view='admin-classes';renderContent()">📚 Classes</div>
        <div class="qa" onclick="state.view='admin-students';renderContent()">👥 Members</div>
        <div class="qa" onclick="createGeneralClass()">＋ New class</div>
      </div>
    `;

  } else if (state.view === 'admin-students') {
    const students = state.users.filter(x => x.schoolId===state.currentSchool.id && x.role==='student');
    const teachers = state.users.filter(x => x.schoolId===state.currentSchool.id && x.role==='teacher');
    title = 'Members';
    html = `
      <div class="card" style="margin-bottom:12px;">
        <div class="sec">Teachers (${teachers.length})</div>
        ${teachers.length ? teachers.map(s=>`<div class="row"><div class="row-icon">📚</div><div class="row-body"><div class="row-name">${escapeHtml(s.name)}</div><div class="row-meta">Teacher</div></div></div>`).join('') : `<div class="empty"><div class="empty-ico">📚</div><p>No teachers yet</p></div>`}
      </div>
      <div class="card">
        <div class="sec">Students (${students.length})</div>
        ${students.length ? students.map(s=>`<div class="row"><div class="row-icon">🎓</div><div class="row-body"><div class="row-name">${escapeHtml(s.name)}</div><div class="row-meta">Student</div></div></div>`).join('') : `<div class="empty"><div class="empty-ico">🎓</div><p>No students yet — share the join code</p></div>`}
      </div>
    `;

  } else if (state.view === 'admin-classes') {
    const general = state.classes.filter(c => c.schoolId===state.currentSchool.id && c.type==='general');
    title = 'Classes';
    html = `
      <div class="card">
        <div class="sec">Year classes (${general.length})</div>
        ${general.length ? general.map(c=>`<div class="row"><div class="row-icon">${c.icon}</div><div class="row-body"><div class="row-name">${escapeHtml(c.name)}</div><div class="row-meta">${c.students?c.students.length:0} students</div></div><div class="row-actions"><button class="btn btn-accent btn-sm" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open</button></div></div>`).join('') : `<div class="empty"><div class="empty-ico">📚</div><p>No year classes yet</p></div>`}
        <button class="btn btn-green btn-sm" style="margin-top:14px;width:100%;" onclick="createGeneralClass()">＋ Create year class</button>
      </div>
    `;

  } else if (state.view === 'admin-settings') {
    title = 'Settings';
    html = `
      <div class="card" style="margin-bottom:12px;">
        <div class="sec">School</div>
        <div class="code-row">
          <div><div class="code-lbl">Join code</div><div class="code-val">${state.currentSchool.code}</div></div>
          <button class="code-copy" onclick="copyCode('${state.currentSchool.code}')">Copy</button>
        </div>
        <div class="row"><div class="row-icon">🏫</div><div class="row-body"><div class="row-name">${escapeHtml(state.currentSchool.name)}</div><div class="row-meta">School name</div></div></div>
      </div>
      <div class="card">
        <div class="sec">Account</div>
        <button class="btn btn-red btn-sm" style="width:100%" onclick="if(confirm('Sign out?'))handleLogout()">Sign out</button>
      </div>
    `;

  } else if (state.view === 'teacher-home') {
    const allC = state.classes.filter(c => c.schoolId===state.currentSchool.id);
    const general = allC.filter(c => c.type==='general');
    const mine = allC.filter(c => c.teacherId===u.id && c.type==='specific');
    title = 'Overview';
    html = `
      <div class="greeting"><h2>Hello, ${escapeHtml(u.name)}</h2><p>${mine.length} class${mine.length!==1?'es':''} · ${mine.reduce((n,c)=>n+(c.students?c.students.length:0),0)} students</p></div>
      <div class="stats">
        <div class="stat"><div class="stat-n">${mine.length}</div><div class="stat-l">My classes</div></div>
        <div class="stat"><div class="stat-n">${general.length}</div><div class="stat-l">Year classes</div></div>
        <div class="stat"><div class="stat-n">${mine.reduce((n,c)=>n+(c.students?c.students.length:0),0)}</div><div class="stat-l">Students</div></div>
      </div>
      <div class="card" style="margin-bottom:12px;">
        <div class="sec">Year classes</div>
        ${general.length ? general.map(c=>`<div class="row"><div class="row-icon">${c.icon}</div><div class="row-body"><div class="row-name">${escapeHtml(c.name)}</div><div class="row-meta">${c.students?c.students.length:0} students</div></div><div class="row-actions"><button class="btn btn-accent btn-sm" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open</button></div></div>`).join('') : `<div class="empty"><div class="empty-ico">📢</div><p>No year classes — ask your admin</p></div>`}
      </div>
      <div class="card">
        <div class="sec">My classes</div>
        ${mine.length ? mine.map(c=>`<div class="row"><div class="row-icon">${c.icon}</div><div class="row-body"><div class="row-name">${escapeHtml(c.name)}</div><div class="row-meta">${c.students?c.students.length:0} students · code: <strong>${c.code}</strong></div></div><div class="row-actions"><button class="btn btn-accent btn-sm" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open</button></div></div>`).join('') : `<div class="empty"><div class="empty-ico">📋</div><p>No classes yet</p></div>`}
        <button class="btn btn-green btn-sm" style="margin-top:14px;width:100%;" onclick="createSpecificClass()">＋ Create class</button>
      </div>
    `;

  } else if (state.view === 'student-home') {
    const allC = state.classes.filter(c => c.schoolId===state.currentSchool.id);
    const general = allC.filter(c => c.type==='general');
    const mine = allC.filter(c => c.type==='specific' && c.students && c.students.includes(u.id));
    const available = allC.filter(c => c.type==='specific' && (!c.students || !c.students.includes(u.id)));
    const myGroups = state.groups.filter(g => g.schoolId===state.currentSchool.id && g.members.includes(u.id));
    title = 'Dashboard';
    html = `
      <div class="greeting"><h2>Hey, ${escapeHtml(u.name)}</h2><p>${mine.length+general.length} classes · ${myGroups.length} group${myGroups.length!==1?'s':''}</p></div>
      <div class="card" style="margin-bottom:12px;">
        <div class="sec">Year classes (${general.length})</div>
        ${general.length ? general.map(c=>`<div class="row"><div class="row-icon">${c.icon}</div><div class="row-body"><div class="row-name">${escapeHtml(c.name)}</div><div class="row-meta">Everyone</div></div><div class="row-actions"><button class="btn btn-accent btn-sm" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open</button></div></div>`).join('') : `<div class="empty"><div class="empty-ico">📢</div><p>No year classes yet</p></div>`}
      </div>
      <div class="card" style="margin-bottom:12px;">
        <div class="sec">My classes (${mine.length})</div>
        ${mine.length ? mine.map(c=>`<div class="row"><div class="row-icon">${c.icon}</div><div class="row-body"><div class="row-name">${escapeHtml(c.name)}</div><div class="row-meta">${c.students?c.students.length:0} students</div></div><div class="row-actions"><button class="btn btn-accent btn-sm" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open</button></div></div>`).join('') : `<div class="empty"><div class="empty-ico">📋</div><p>Join a class below</p></div>`}
      </div>
      ${available.length ? `<div class="card" style="margin-bottom:12px;"><div class="sec">Available (${available.length})</div>${available.map(c=>`<div class="row"><div class="row-icon">${c.icon}</div><div class="row-body"><div class="row-name">${escapeHtml(c.name)}</div><div class="row-meta">Ask teacher for code</div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" onclick="joinSpecificClass('${c.id}')">Join</button></div></div>`).join('')}</div>` : ''}
      <div class="card">
        <div class="sec">Study groups (${myGroups.length})</div>
        ${myGroups.length ? myGroups.map(g=>`<div class="row"><div class="row-icon">${g.icon}</div><div class="row-body"><div class="row-name">${escapeHtml(g.name)}</div><div class="row-meta">${g.members.length} member${g.members.length!==1?'s':''}</div></div><div class="row-actions"><button class="btn btn-accent btn-sm" onclick="state.view='chat';state.viewData='group-${g.id}';renderContent()">Open</button></div></div>`).join('') : `<div class="empty"><div class="empty-ico">👫</div><p>No groups yet</p></div>`}
        <button class="btn btn-green btn-sm" style="margin-top:14px;width:100%;" onclick="createGroup()">＋ Create group</button>
      </div>
    `;

  } else if (state.view === 'chat') {
    const [type, id] = state.viewData.split('-');
    const item = type==='class' ? state.classes.find(c=>c.id===id) : state.groups.find(g=>g.id===id);
    if (!item) { state.view='home'; renderContent(); return; }
    const msgs = state.messages[state.viewData] || [];
    title = item.icon + ' ' + escapeHtml(item.name);
    foot = 'flex';
    html = `<div class="chat-body" id="chat-scroll">`;
    if (!msgs.length) {
      html += `<div class="empty" style="margin:auto;"><div class="empty-ico">💬</div><p>No messages yet</p></div>`;
    } else {
      msgs.forEach(msg => {
        const sender = state.users.find(x=>x.id===msg.userId);
        const own = msg.userId===u.id;
        html += `<div class="msg ${own?'own':''}">
          <div class="msg-av">${sender?sender.avatar:'?'}</div>
          <div class="msg-col">
            ${!own?`<div class="msg-sender">${sender?escapeHtml(sender.name):'Unknown'}</div>`:''}
            <div class="msg-bub">${escapeHtml(msg.text)}</div>
            <div class="msg-time">${new Date(msg.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
  }

  hdr.textContent = title;
  // For chat, main-body needs to be flex column to fill space
  if (state.view === 'chat') {
    $('main-content').style.padding = '0';
    $('main-content').style.display = 'flex';
    $('main-content').style.flexDirection = 'column';
    $('main-content').style.overflow = 'hidden';
  } else {
    $('main-content').style.padding = '24px';
    $('main-content').style.display = 'block';
    $('main-content').style.overflow = '';
  }
  content.innerHTML = html;
  footer.style.display = foot;

  if (foot === 'flex') {
    const inp = $('msg-input');
    if (inp) inp.focus();
    setTimeout(() => { const s=document.getElementById('chat-scroll'); if(s) s.scrollTop=s.scrollHeight; }, 50);
  }
}

function sendMessage() {
  const inp = $('msg-input');
  const text = inp.value.trim();
  if (!text) return;
  if (!state.messages[state.viewData]) state.messages[state.viewData] = [];
  state.messages[state.viewData].push({ userId: state.currentUser.id, text, time: Date.now() });
  saveState(); inp.value = ''; renderContent();
}

function createGeneralClass() {
  const name = prompt('Year class name:'); if (!name||!name.trim()) return;
  const icon = prompt('Icon (e.g. 📢):') || '📢';
  state.classes.push({ id:'c'+Date.now(), schoolId:state.currentSchool.id, name:name.trim(), icon, type:'general', code:'CLASS-'+Math.floor(1000+Math.random()*9000), teacherId:state.currentUser.id, students:[] });
  saveState(); toast('Class created', 'success'); renderApp();
}
function createSpecificClass() {
  const name = prompt('Class name:'); if (!name||!name.trim()) return;
  const icon = prompt('Icon (e.g. 📐):') || '📐';
  const cls = { id:'c'+Date.now(), schoolId:state.currentSchool.id, name:name.trim(), icon, type:'specific', code:'CLASS-'+Math.floor(1000+Math.random()*9000), teacherId:state.currentUser.id, students:[] };
  state.classes.push(cls); saveState(); toast('Class created · code: '+cls.code, 'success'); renderApp();
}
function joinSpecificClass(classId) {
  const cls = state.classes.find(c=>c.id===classId); if (!cls) return;
  const code = prompt('Enter class code:'); if (!code) return;
  if (code.trim().toUpperCase()!==cls.code) { toast('Wrong code','error'); return; }
  if (!cls.students) cls.students=[];
  cls.students.push(state.currentUser.id); saveState(); toast('Joined '+cls.name,'success'); renderApp();
}
function createGroup() {
  const name = prompt('Group name:'); if (!name||!name.trim()) return;
  const icon = prompt('Icon (e.g. 🔬):') || '👥';
  state.groups.push({ id:'g'+Date.now(), schoolId:state.currentSchool.id, name:name.trim(), icon, ownerId:state.currentUser.id, members:[state.currentUser.id] });
  saveState(); toast('Group created','success'); renderApp();
}

// Bind buttons
document.getElementById('btn-do-login').addEventListener('click', handleLogin);
document.getElementById('btn-show-signup').addEventListener('click', showSignup);
document.getElementById('btn-do-signup').addEventListener('click', handleSignup);
document.getElementById('btn-show-login').addEventListener('click', showLogin);
document.getElementById('btn-logout').addEventListener('click', handleLogout);
document.getElementById('btn-send').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => { if (e.key==='Enter') sendMessage(); });
document.querySelectorAll('.role-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.loginRole = btn.dataset.role;
  });
});

showLogin();
</script>
</body>
</html>
