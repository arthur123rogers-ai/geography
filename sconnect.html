<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sconnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #5b6af5;
      --primary-dark: #4a58e0;
      --primary-light: #eef0ff;
      --secondary: #38e2c2;
      --secondary-light: #e0faf6;
      --bg: #f4f5fb;
      --surface: #ffffff;
      --surface2: #f0f1f8;
      --border: #e4e5f0;
      --text: #1a1b2e;
      --muted: #6b7280;
      --success: #22c55e;
      --success-light: #dcfce7;
      --error: #ef4444;
      --warning: #f59e0b;
      --grad: linear-gradient(135deg, #5b6af5 0%, #38e2c2 100%);
      --grad-soft: linear-gradient(135deg, #eef0ff 0%, #e0faf6 100%);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 16px rgba(91,106,245,0.10), 0 1px 4px rgba(0,0,0,0.05);
      --shadow-lg: 0 12px 40px rgba(91,106,245,0.15), 0 2px 8px rgba(0,0,0,0.06);
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

    /* ── Toast ── */
    .toast-wrap { position: fixed; top: 76px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--primary); padding: 12px 18px;
      border-radius: 10px; font-size: 13px; box-shadow: var(--shadow);
      animation: slideIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
      display: flex; align-items: center; gap: 8px;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error   { border-left-color: var(--error); }
    @keyframes slideIn { from { opacity:0; transform:translateX(24px) scale(0.96); } to { opacity:1; transform:translateX(0) scale(1); } }

    /* ── Nav ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      display: flex; align-items: center; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 0 24px;
      z-index: 100; box-shadow: var(--shadow-sm);
    }
    .nav-logo { font-family: 'Syne'; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .nav-logo span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-spacer { flex: 1; }
    .nav-user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--grad);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .nav-info { display: flex; flex-direction: column; line-height: 1.2; }
    .nav-name { font-weight: 600; font-size: 13px; }
    .nav-school { font-size: 11px; color: var(--muted); }

    /* ── Buttons ── */
    .btn {
      border: none; cursor: pointer; font-family: inherit; font-size: 13px;
      font-weight: 600; padding: 8px 16px; border-radius: 8px; transition: all 0.18s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(91,106,245,0.3); }
    .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 4px 16px rgba(91,106,245,0.4); transform: translateY(-1px); }
    .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--surface2); border-color: var(--primary); color: var(--primary); }
    .btn-danger { background: var(--error); color: #fff; }
    .btn-success { background: var(--success); color: #fff; box-shadow: 0 2px 8px rgba(34,197,94,0.25); }
    .btn-success:hover { background: #16a34a; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-small { padding: 5px 11px; font-size: 12px; border-radius: 6px; }
    .btn-icon { padding: 7px; border-radius: 8px; }

    /* ── App layout ── */
    .app { display: flex; height: 100vh; padding-top: 60px; }

    /* ── Sidebar ── */
    .sidebar {
      width: 268px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px 16px 16px; background: var(--grad); color: #fff; position: relative; overflow: hidden;
    }
    .sidebar-header::before {
      content: ''; position: absolute; top: -20px; right: -20px;
      width: 100px; height: 100px; background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .sidebar-header::after {
      content: ''; position: absolute; bottom: -30px; left: -10px;
      width: 80px; height: 80px; background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .sidebar-school-name { font-family: 'Syne'; font-size: 15px; font-weight: 700; margin-bottom: 4px; position: relative; z-index: 1; }
    .sidebar-role-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.2); border-radius: 999px;
      padding: 3px 10px; font-size: 11px; font-weight: 600;
      backdrop-filter: blur(8px); position: relative; z-index: 1;
    }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .sidebar-section-label {
      padding: 12px 8px 6px; font-size: 10px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px;
    }
    .sidebar-item {
      padding: 9px 12px; margin-bottom: 2px; border-radius: 8px; cursor: pointer;
      transition: all 0.15s; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 9px; color: var(--text);
    }
    .sidebar-item:hover { background: var(--primary-light); color: var(--primary); }
    .sidebar-item.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(91,106,245,0.3); }
    .sidebar-item .item-icon { font-size: 15px; flex-shrink: 0; }
    .sidebar-divider { margin: 8px 8px; border: none; border-top: 1px solid var(--border); }
    .sidebar-action {
      margin: 4px 8px; padding: 9px 12px; border-radius: 8px; cursor: pointer;
      background: var(--success-light); color: #166534; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; transition: all 0.15s;
      border: 1px solid rgba(34,197,94,0.2);
    }
    .sidebar-action:hover { background: #bbf7d0; transform: translateY(-1px); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
    .main-header {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); box-shadow: var(--shadow-sm);
    }
    .main-header h1 { font-size: 17px; font-weight: 700; }
    .main-content { flex: 1; overflow-y: auto; padding: 24px; }
    .main-footer {
      padding: 12px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; background: var(--surface); align-items: center;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .card-header { font-weight: 700; font-size: 15px; margin-bottom: 14px; }

    /* ── Stats ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 16px; display: flex; flex-direction: column;
      gap: 6px; box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s;
    }
    .stat-box:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-icon { font-size: 24px; margin-bottom: 4px; }
    .stat-num { font-size: 28px; font-weight: 800; line-height: 1; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { font-size: 12px; color: var(--muted); font-weight: 500; }

    /* ── Welcome banner ── */
    .welcome-banner {
      background: var(--grad); border-radius: 14px; padding: 24px;
      color: #fff; margin-bottom: 20px; position: relative; overflow: hidden;
    }
    .welcome-banner::before {
      content: ''; position: absolute; top: -30px; right: -30px;
      width: 150px; height: 150px; background: rgba(255,255,255,0.08); border-radius: 50%;
    }
    .welcome-banner::after {
      content: ''; position: absolute; bottom: -50px; right: 80px;
      width: 100px; height: 100px; background: rgba(255,255,255,0.06); border-radius: 50%;
    }
    .welcome-banner h2 { font-family: 'Syne'; font-size: 20px; font-weight: 700; margin-bottom: 6px; position: relative; z-index: 1; }
    .welcome-banner p { font-size: 13px; opacity: 0.85; position: relative; z-index: 1; margin-bottom: 0; }

    /* ── School code badge ── */
    .school-code-wrap {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
      background: var(--grad-soft); border: 1px solid var(--primary-light);
      border-radius: 10px; padding: 14px 16px;
    }
    .school-code-label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    .school-code-value {
      font-family: 'Syne'; font-size: 18px; font-weight: 800; letter-spacing: 3px;
      color: var(--primary); flex: 1;
    }
    .copy-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid var(--primary);
      background: transparent; color: var(--primary); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { background: var(--primary); color: #fff; }

    /* ── Section header ── */
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── List items ── */
    .list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--surface2); border-radius: 10px;
      margin-bottom: 8px; transition: all 0.15s; border: 1px solid transparent;
    }
    .list-item:hover { border-color: var(--primary); background: var(--primary-light); }
    .list-item-icon {
      width: 36px; height: 36px; border-radius: 9px; display: flex;
      align-items: center; justify-content: center; font-size: 17px;
      background: var(--surface); box-shadow: var(--shadow-sm); flex-shrink: 0; margin-right: 12px;
    }
    .list-item-info { flex: 1; }
    .list-item-name { font-weight: 600; font-size: 13px; }
    .list-item-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .list-item-actions { display: flex; gap: 6px; }

    /* ── User avatar row ── */
    .avatar-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .user-chip {
      display: flex; align-items: center; gap: 7px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px 4px 6px;
      font-size: 12px; font-weight: 500;
    }
    .chip-avatar {
      width: 24px; height: 24px; border-radius: 50%; background: var(--grad);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 10px; flex-shrink: 0;
    }

    /* ── Quick actions ── */
    .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .quick-action-btn {
      display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text);
      transition: all 0.15s; box-shadow: var(--shadow-sm);
    }
    .quick-action-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); transform: translateY(-1px); box-shadow: var(--shadow); }
    .quick-action-btn .qa-icon { font-size: 18px; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 32px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }

    /* ── Chat ── */
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
    .message { display: flex; gap: 10px; margin-bottom: 4px; }
    .message.own { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--grad);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; flex-shrink: 0; align-self: flex-end; margin-bottom: 2px;
    }
    .msg-content { display: flex; flex-direction: column; max-width: 62%; gap: 2px; }
    .message.own .msg-content { align-items: flex-end; }
    .msg-name { font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 4px 2px; }
    .msg-bubble {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      border-bottom-left-radius: 4px; padding: 10px 14px; box-shadow: var(--shadow-sm);
    }
    .message.own .msg-bubble {
      background: var(--primary); color: #fff; border: none;
      border-radius: 14px; border-bottom-right-radius: 4px;
    }
    .msg-text { font-size: 13px; line-height: 1.5; }
    .msg-time { font-size: 10px; color: var(--muted); margin: 0 4px; }
    .message.own .msg-time { color: rgba(255,255,255,0.6); }

    /* ── Message input ── */
    .msg-input-wrap { position: relative; flex: 1; }
    .form-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 14px; font-size: 13px; outline: none; background: var(--surface);
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--primary); }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .form-group { margin-bottom: 16px; }

    /* ── Auth ── */
    .page { display: none; }
    .page.active { display: flex; }
    .auth-page { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
    .auth-card {
      width: 100%; max-width: 420px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 40px;
      box-shadow: var(--shadow-lg);
    }
    .auth-logo { font-family: 'Syne'; font-size: 30px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .auth-logo span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .auth-tagline { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .auth-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .auth-subtitle { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 22px; }
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .role-btn {
      border: 1.5px solid var(--border); background: var(--surface2); padding: 14px 8px;
      border-radius: 10px; cursor: pointer; text-align: center; font-size: 12px;
      font-weight: 600; transition: all 0.18s; color: var(--text);
    }
    .role-btn .role-emoji { font-size: 20px; display: block; margin-bottom: 4px; }
    .role-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .role-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(91,106,245,0.3); }
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--muted); font-size: 12px; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { width: 0; overflow: hidden; }
      .sidebar.mobile-open { width: 268px; position: absolute; left: 0; top: 60px; z-index: 50; height: calc(100vh - 60px); }
    }
  </style>
</head>
<body>

<div class="toast-wrap" id="toast-wrap"></div>

<!-- AUTH PAGE -->
<div id="page-auth" class="page active">
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">S<span>connect</span></div>
      <p class="auth-tagline">Your school. Connected.</p>

      <div id="auth-form">
        <h2 class="auth-title" id="auth-title">Welcome back</h2>
        <p class="auth-subtitle" id="auth-subtitle">Enter your school code and name to join</p>
        <div class="form-group">
          <label class="form-label">School Code</label>
          <input class="form-input" id="code-input" type="text" placeholder="SCHOOL-0000" style="text-transform:uppercase;letter-spacing:2px;font-weight:700;" />
        </div>
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input class="form-input" id="name-input" type="text" placeholder="e.g. Alex Johnson" />
        </div>
        <div class="form-group">
          <label class="form-label">Your Role</label>
          <div class="role-grid" id="role-grid">
            <button class="role-btn active" data-role="student"><span class="role-emoji">🎓</span>Student</button>
            <button class="role-btn" data-role="teacher"><span class="role-emoji">📚</span>Teacher</button>
            <button class="role-btn" data-role="admin"><span class="role-emoji">👑</span>Admin</button>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:13px;font-size:14px;justify-content:center;" onclick="handleLogin()">Join School →</button>
        <div class="auth-divider">or</div>
        <button class="btn btn-secondary" style="width:100%;padding:11px;justify-content:center;" onclick="showSignup()">Create a new school</button>
      </div>

      <div id="signup-form" style="display:none;">
        <h2 class="auth-title">Create your school</h2>
        <p class="auth-subtitle">You'll be the admin and get a shareable code</p>
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input class="form-input" id="signup-name" type="text" placeholder="e.g. Jane Smith" />
        </div>
        <div class="form-group">
          <label class="form-label">School Name</label>
          <input class="form-input" id="signup-school" type="text" placeholder="e.g. Lincoln High School" />
        </div>
        <button class="btn btn-primary" style="width:100%;padding:13px;font-size:14px;justify-content:center;" onclick="handleSignup()">Create School →</button>
        <div class="auth-divider">or</div>
        <button class="btn btn-ghost" style="width:100%;padding:11px;justify-content:center;" onclick="showLogin()">← Back to sign in</button>
      </div>
    </div>
  </div>
</div>

<!-- APP PAGE -->
<div id="page-app" class="page">
  <nav class="nav">
    <div class="nav-logo">S<span>connect</span></div>
    <div class="nav-spacer"></div>
    <div class="nav-user">
      <div class="nav-avatar" id="nav-avatar">?</div>
      <div class="nav-info">
        <span class="nav-name" id="nav-user-name">User</span>
        <span class="nav-school" id="nav-school-name">School</span>
      </div>
      <button class="btn btn-ghost btn-small" onclick="handleLogout()">Sign out</button>
    </div>
  </nav>

  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-school-name" id="sidebar-school">School</div>
        <div class="sidebar-role-badge" id="sidebar-role">Role</div>
      </div>
      <div class="sidebar-content" id="sidebar-content"></div>
    </div>

    <div class="main">
      <div class="main-header" id="main-header">
        <h1>Dashboard</h1>
        <div id="header-actions" style="display:flex;gap:8px;"></div>
      </div>
      <div class="main-content" id="main-content"></div>
      <div class="main-footer" id="main-footer" style="display:none;">
        <input class="form-input" id="msg-input" type="text" placeholder="Type a message…" />
        <button class="btn btn-primary btn-small" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const state = {
  currentUser: null,
  currentSchool: null,
  loginRole: 'student',
  view: 'home',
  viewData: null,
  schools: [],
  users: [],
  classes: [],
  groups: [],
  messages: {},
};

function $(id) { return document.getElementById(id); }

function toast(msg, type = 'info') {
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
  el.innerHTML = `<span>${icons[type] || icons.info}</span><span>${msg}</span>`;
  $('toast-wrap').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(24px)'; el.style.transition = 'all 0.2s'; setTimeout(() => el.remove(), 220); }, 2800);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function loadState() {
  try { const s = localStorage.getItem('sconnect'); if (s) Object.assign(state, JSON.parse(s)); } catch(e) {}
}
function saveState() { localStorage.setItem('sconnect', JSON.stringify(state)); }

loadState();

window.addEventListener('load', () => {
  if (state.currentUser && state.currentSchool) gotoApp();
});

function showLogin() {
  $('auth-form').style.display = 'block';
  $('signup-form').style.display = 'none';
  setTimeout(() => $('code-input').focus(), 50);
}
function showSignup() {
  $('auth-form').style.display = 'none';
  $('signup-form').style.display = 'block';
  setTimeout(() => $('signup-name').focus(), 50);
}

function handleSignup() {
  const name = $('signup-name').value.trim();
  const school = $('signup-school').value.trim();
  if (!name || !school) { toast('Please fill in all fields', 'error'); return; }
  const schoolCode = 'SCHOOL-' + Math.floor(1000 + Math.random() * 9000);
  const schoolObj = { id: 's' + Date.now(), code: schoolCode, name: school };
  const admin = { id: 'a' + Date.now(), schoolId: schoolObj.id, name, role: 'admin', avatar: name[0].toUpperCase() };
  state.schools.push(schoolObj);
  state.users.push(admin);
  state.currentSchool = schoolObj;
  state.currentUser = admin;
  saveState();
  toast('School created! Code: ' + schoolCode, 'success');
  gotoApp();
}

function handleLogin() {
  const code = $('code-input').value.trim().toUpperCase();
  const name = $('name-input').value.trim();
  if (!code || !name) { toast('Code and name are required', 'error'); return; }
  const school = state.schools.find(s => s.code === code);
  if (!school) { toast('School code not found', 'error'); return; }
  let user = state.users.find(u => u.schoolId === school.id && u.name === name && u.role === state.loginRole);
  if (!user) {
    user = { id: state.loginRole[0] + Date.now(), schoolId: school.id, name, role: state.loginRole, avatar: name[0].toUpperCase() };
    state.users.push(user);
  }
  state.currentUser = user;
  state.currentSchool = school;
  saveState();
  toast('Welcome back, ' + user.name + '!', 'success');
  gotoApp();
}

function handleLogout() {
  state.currentUser = null;
  state.currentSchool = null;
  saveState();
  $('page-auth').classList.add('active');
  $('page-app').classList.remove('active');
  showLogin();
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => toast('Code copied!', 'success'));
}

function gotoApp() {
  $('page-auth').classList.remove('active');
  $('page-app').classList.add('active');
  renderApp();
}

function renderApp() {
  const u = state.currentUser;
  $('nav-avatar').textContent = u.avatar;
  $('nav-user-name').textContent = u.name;
  $('nav-school-name').textContent = state.currentSchool.name;
  $('sidebar-school').textContent = state.currentSchool.name;

  const roleIcons = { admin: '👑', teacher: '📚', student: '🎓' };
  $('sidebar-role').innerHTML = `${roleIcons[u.role] || ''} ${u.role.charAt(0).toUpperCase() + u.role.slice(1)}`;

  const sidebar = $('sidebar-content');
  let html = '';

  if (u.role === 'admin') {
    html = `
      <div class="sidebar-item active" onclick="state.view='admin-home';renderContent()"><span class="item-icon">📊</span>Dashboard</div>
      <div class="sidebar-item" onclick="state.view='admin-students';renderContent()"><span class="item-icon">👥</span>All Members</div>
      <div class="sidebar-item" onclick="state.view='admin-classes';renderContent()"><span class="item-icon">📚</span>Classes</div>
      <div class="sidebar-item" onclick="state.view='admin-settings';renderContent()"><span class="item-icon">⚙️</span>Settings</div>
    `;
  } else if (u.role === 'teacher') {
    const myClasses = state.classes.filter(c => c.schoolId === state.currentSchool.id && c.teacherId === u.id);
    html = `
      <div class="sidebar-item active" onclick="state.view='teacher-home';renderContent()"><span class="item-icon">🏠</span>Overview</div>
      ${myClasses.length ? '<div class="sidebar-section-label">My Classes</div>' + myClasses.map(c => `<div class="sidebar-item" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()"><span class="item-icon">${c.icon}</span>${escapeHtml(c.name)}</div>`).join('') : ''}
    `;
  } else {
    const myGroups = state.groups.filter(g => g.schoolId === state.currentSchool.id && g.members.includes(u.id));
    const allClasses = state.classes.filter(c => c.schoolId === state.currentSchool.id);
    const generalClasses = allClasses.filter(c => c.type === 'general');
    const mySpecificClasses = allClasses.filter(c => c.type === 'specific' && c.students && c.students.includes(u.id));
    html = `
      <div class="sidebar-item active" onclick="state.view='student-home';renderContent()"><span class="item-icon">🏠</span>My Dashboard</div>
      ${generalClasses.length ? '<div class="sidebar-section-label">Year Classes</div>' + generalClasses.map(c => `<div class="sidebar-item" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()"><span class="item-icon">${c.icon}</span>${escapeHtml(c.name)}</div>`).join('') : ''}
      ${mySpecificClasses.length ? '<div class="sidebar-section-label">My Classes</div>' + mySpecificClasses.map(c => `<div class="sidebar-item" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()"><span class="item-icon">${c.icon}</span>${escapeHtml(c.name)}</div>`).join('') : ''}
      ${myGroups.length ? '<div class="sidebar-section-label">Study Groups</div>' + myGroups.map(g => `<div class="sidebar-item" onclick="state.view='chat';state.viewData='group-${g.id}';renderContent()"><span class="item-icon">${g.icon}</span>${escapeHtml(g.name)}</div>`).join('') : ''}
    `;
  }

  // Sidebar create actions
  if (u.role === 'teacher') {
    html += `<hr class="sidebar-divider"><div class="sidebar-action" onclick="createSpecificClass()"><span>＋</span>Create Class</div>`;
  } else if (u.role === 'admin') {
    html += `<hr class="sidebar-divider"><div class="sidebar-action" onclick="createGeneralClass()"><span>＋</span>New General Class</div>`;
  } else {
    html += `<hr class="sidebar-divider"><div class="sidebar-action" onclick="createGroup()"><span>＋</span>Create Study Group</div>`;
  }

  sidebar.innerHTML = html;
  sidebar.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', function() {
      sidebar.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      this.classList.add('active');
    });
  });

  renderContent();
}

function renderContent() {
  const u = state.currentUser;
  const content = $('main-content');
  const footer = $('main-footer');
  const headerEl = $('main-header').querySelector('h1');
  let headerHtml = '', contentHtml = '', footerDisplay = 'none';

  if (state.view === 'admin-home') {
    const allUsers = state.users.filter(u => u.schoolId === state.currentSchool.id);
    const allClasses = state.classes.filter(c => c.schoolId === state.currentSchool.id);
    const allGroups = state.groups.filter(g => g.schoolId === state.currentSchool.id);
    const recentUsers = [...allUsers].reverse().slice(0, 8);
    headerHtml = 'Dashboard';
    contentHtml = `
      <div class="welcome-banner">
        <h2>Good day, ${escapeHtml(u.name)}! 👑</h2>
        <p>Here's a snapshot of ${escapeHtml(state.currentSchool.name)}</p>
      </div>
      <div class="school-code-wrap">
        <div>
          <div class="school-code-label">School Join Code</div>
          <div class="school-code-value">${state.currentSchool.code}</div>
        </div>
        <button class="copy-btn" onclick="copyCode('${state.currentSchool.code}')">Copy</button>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-icon">👥</div><div class="stat-num">${allUsers.length}</div><div class="stat-label">Total Members</div></div>
        <div class="stat-box"><div class="stat-icon">📚</div><div class="stat-num">${allClasses.length}</div><div class="stat-label">Classes</div></div>
        <div class="stat-box"><div class="stat-icon">👫</div><div class="stat-num">${allGroups.length}</div><div class="stat-label">Study Groups</div></div>
        <div class="stat-box"><div class="stat-icon">🎓</div><div class="stat-num">${allUsers.filter(u => u.role === 'student').length}</div><div class="stat-label">Students</div></div>
      </div>
      <div class="card">
        <div class="section-title">Recent Members</div>
        ${recentUsers.length ? `<div class="avatar-row">${recentUsers.map(u => `<div class="user-chip"><div class="chip-avatar">${u.avatar}</div>${escapeHtml(u.name)}</div>`).join('')}</div>` : `<div class="empty-state"><div class="empty-icon">👥</div><p>No members yet. Share the school code!</p></div>`}
      </div>
      <div class="quick-actions">
        <div class="quick-action-btn" onclick="state.view='admin-classes';renderContent()"><span class="qa-icon">📚</span>Manage Classes</div>
        <div class="quick-action-btn" onclick="state.view='admin-students';renderContent()"><span class="qa-icon">👥</span>View Members</div>
        <div class="quick-action-btn" onclick="createGeneralClass()"><span class="qa-icon">➕</span>New Class</div>
      </div>
    `;

  } else if (state.view === 'admin-students') {
    const students = state.users.filter(u => u.schoolId === state.currentSchool.id && u.role === 'student');
    const teachers = state.users.filter(u => u.schoolId === state.currentSchool.id && u.role === 'teacher');
    headerHtml = 'Members';
    contentHtml = `
      <div class="card" style="margin-bottom:12px;">
        <div class="section-title">Teachers (${teachers.length})</div>
        ${teachers.length ? teachers.map(s => `<div class="list-item"><div class="list-item-icon">📚</div><div class="list-item-info"><div class="list-item-name">${escapeHtml(s.name)}</div><div class="list-item-meta">Teacher</div></div></div>`).join('') : `<div class="empty-state"><div class="empty-icon">📚</div><p>No teachers joined yet</p></div>`}
      </div>
      <div class="card">
        <div class="section-title">Students (${students.length})</div>
        ${students.length ? students.map(s => `<div class="list-item"><div class="list-item-icon">🎓</div><div class="list-item-info"><div class="list-item-name">${escapeHtml(s.name)}</div><div class="list-item-meta">Student</div></div></div>`).join('') : `<div class="empty-state"><div class="empty-icon">🎓</div><p>No students joined yet. Share the code!</p></div>`}
      </div>
    `;

  } else if (state.view === 'admin-classes') {
    const allClasses = state.classes.filter(c => c.schoolId === state.currentSchool.id);
    const generalClasses = allClasses.filter(c => c.type === 'general');
    headerHtml = 'Classes';
    contentHtml = `
      <div class="card">
        <div class="section-title">Year-Level Classes (${generalClasses.length})</div>
        ${generalClasses.length ? generalClasses.map(c => `
          <div class="list-item">
            <div class="list-item-icon">${c.icon}</div>
            <div class="list-item-info">
              <div class="list-item-name">${escapeHtml(c.name)}</div>
              <div class="list-item-meta">${c.students ? c.students.length : 0} students</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-primary btn-small" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open Chat</button>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="empty-icon">📚</div><p>No year classes yet</p></div>`}
        <button class="btn btn-success" style="width:100%;padding:11px;margin-top:12px;justify-content:center;" onclick="createGeneralClass()">＋ Create Year Class</button>
      </div>
    `;

  } else if (state.view === 'teacher-home') {
    const allClasses = state.classes.filter(c => c.schoolId === state.currentSchool.id);
    const generalClasses = allClasses.filter(c => c.type === 'general');
    const myClasses = allClasses.filter(c => c.teacherId === u.id && c.type === 'specific');
    headerHtml = 'My Dashboard';
    contentHtml = `
      <div class="welcome-banner">
        <h2>Hello, ${escapeHtml(u.name)}! 📚</h2>
        <p>You have ${myClasses.length} specific class${myClasses.length !== 1 ? 'es' : ''} and access to ${generalClasses.length} year class${generalClasses.length !== 1 ? 'es' : ''}</p>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-icon">🏫</div><div class="stat-num">${myClasses.length}</div><div class="stat-label">My Classes</div></div>
        <div class="stat-box"><div class="stat-icon">📢</div><div class="stat-num">${generalClasses.length}</div><div class="stat-label">Year Classes</div></div>
        <div class="stat-box"><div class="stat-icon">🎓</div><div class="stat-num">${myClasses.reduce((n, c) => n + (c.students ? c.students.length : 0), 0)}</div><div class="stat-label">My Students</div></div>
      </div>
      <div class="card" style="margin-bottom:12px;">
        <div class="section-title">Year Classes — All Teachers</div>
        ${generalClasses.length ? generalClasses.map(c => `
          <div class="list-item">
            <div class="list-item-icon">${c.icon}</div>
            <div class="list-item-info">
              <div class="list-item-name">${escapeHtml(c.name)}</div>
              <div class="list-item-meta">${c.students ? c.students.length : 0} students enrolled</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-primary btn-small" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Chat</button>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="empty-icon">📢</div><p>No year classes yet — ask your admin to create one</p></div>`}
      </div>
      <div class="card">
        <div class="section-title">My Specific Classes</div>
        ${myClasses.length ? myClasses.map(c => `
          <div class="list-item">
            <div class="list-item-icon">${c.icon}</div>
            <div class="list-item-info">
              <div class="list-item-name">${escapeHtml(c.name)}</div>
              <div class="list-item-meta">${c.students ? c.students.length : 0} students · Code: <strong>${c.code}</strong></div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-primary btn-small" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Chat</button>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="empty-icon">📋</div><p>Create a class to get started</p></div>`}
        <button class="btn btn-success" style="width:100%;padding:11px;margin-top:12px;justify-content:center;" onclick="createSpecificClass()">＋ Create Specific Class</button>
      </div>
    `;

  } else if (state.view === 'student-home') {
    const allClasses = state.classes.filter(c => c.schoolId === state.currentSchool.id);
    const generalClasses = allClasses.filter(c => c.type === 'general');
    const mySpecificClasses = allClasses.filter(c => c.type === 'specific' && c.students && c.students.includes(u.id));
    const availableClasses = allClasses.filter(c => c.type === 'specific' && (!c.students || !c.students.includes(u.id)));
    const myGroups = state.groups.filter(g => g.schoolId === state.currentSchool.id && g.members.includes(u.id));
    headerHtml = 'My Dashboard';
    contentHtml = `
      <div class="welcome-banner">
        <h2>Hey, ${escapeHtml(u.name)}! 👋</h2>
        <p>${mySpecificClasses.length + generalClasses.length} classes · ${myGroups.length} study group${myGroups.length !== 1 ? 's' : ''}</p>
      </div>
      <div class="card" style="margin-bottom:12px;">
        <div class="section-title">Year Classes (${generalClasses.length})</div>
        ${generalClasses.length ? generalClasses.map(c => `
          <div class="list-item">
            <div class="list-item-icon">${c.icon}</div>
            <div class="list-item-info">
              <div class="list-item-name">${escapeHtml(c.name)}</div>
              <div class="list-item-meta">Everyone is in this class</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-primary btn-small" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open</button>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="empty-icon">📢</div><p>No year classes yet</p></div>`}
      </div>
      <div class="card" style="margin-bottom:12px;">
        <div class="section-title">My Classes (${mySpecificClasses.length})</div>
        ${mySpecificClasses.length ? mySpecificClasses.map(c => `
          <div class="list-item">
            <div class="list-item-icon">${c.icon}</div>
            <div class="list-item-info">
              <div class="list-item-name">${escapeHtml(c.name)}</div>
              <div class="list-item-meta">${c.students ? c.students.length : 0} students enrolled</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-primary btn-small" onclick="state.view='chat';state.viewData='class-${c.id}';renderContent()">Open</button>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="empty-icon">📋</div><p>No specific classes yet — join one below!</p></div>`}
      </div>
      ${availableClasses.length ? `
      <div class="card" style="margin-bottom:12px;">
        <div class="section-title">Available to Join (${availableClasses.length})</div>
        ${availableClasses.map(c => `
          <div class="list-item">
            <div class="list-item-icon">${c.icon}</div>
            <div class="list-item-info">
              <div class="list-item-name">${escapeHtml(c.name)}</div>
              <div class="list-item-meta">Ask your teacher for the class code</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-secondary btn-small" onclick="joinSpecificClass('${c.id}')">Join</button>
            </div>
          </div>`).join('')}
      </div>` : ''}
      <div class="card">
        <div class="section-title">Study Groups (${myGroups.length})</div>
        ${myGroups.length ? myGroups.map(g => `
          <div class="list-item">
            <div class="list-item-icon">${g.icon}</div>
            <div class="list-item-info">
              <div class="list-item-name">${escapeHtml(g.name)}</div>
              <div class="list-item-meta">${g.members.length} member${g.members.length !== 1 ? 's' : ''}</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-primary btn-small" onclick="state.view='chat';state.viewData='group-${g.id}';renderContent()">Open</button>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="empty-icon">👫</div><p>No study groups yet</p></div>`}
        <button class="btn btn-success" style="width:100%;padding:11px;margin-top:12px;justify-content:center;" onclick="createGroup()">＋ Create Study Group</button>
      </div>
    `;

  } else if (state.view === 'chat') {
    const [type, id] = state.viewData.split('-');
    const item = type === 'class' ? state.classes.find(c => c.id === id) : state.groups.find(g => g.id === id);
    if (!item) { state.view = 'home'; renderContent(); return; }

    const msgKey = state.viewData;
    const msgs = state.messages[msgKey] || [];
    headerHtml = item.icon + ' ' + escapeHtml(item.name);
    footerDisplay = 'flex';

    contentHtml = `<div style="display:flex;flex-direction:column;height:calc(100vh - 145px);">
      <div class="chat-messages" id="chat-scroll">`;
    if (!msgs.length) {
      contentHtml += `<div class="empty-state" style="margin:auto;"><div class="empty-icon">💬</div><p>No messages yet. Say something!</p></div>`;
    } else {
      msgs.forEach(msg => {
        const sender = state.users.find(u => u.id === msg.userId);
        const isOwn = msg.userId === u.id;
        contentHtml += `<div class="message ${isOwn ? 'own' : ''}">
          <div class="msg-avatar">${sender ? sender.avatar : '?'}</div>
          <div class="msg-content">
            ${!isOwn ? `<div class="msg-name">${sender ? escapeHtml(sender.name) : 'Unknown'}</div>` : ''}
            <div class="msg-bubble"><div class="msg-text">${escapeHtml(msg.text)}</div></div>
            <div class="msg-time">${new Date(msg.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </div>`;
      });
    }
    contentHtml += `</div></div>`;
  }

  headerEl.textContent = headerHtml;
  content.innerHTML = contentHtml;
  footer.style.display = footerDisplay;

  if (footerDisplay === 'flex') {
    const input = $('msg-input');
    if (input) {
      input.focus();
      input.onkeypress = e => { if (e.key === 'Enter') sendMessage(); };
    }
    setTimeout(() => {
      const scroll = document.getElementById('chat-scroll');
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
    }, 50);
  }
}

function sendMessage() {
  const input = $('msg-input');
  const text = input.value.trim();
  if (!text) return;
  const msgKey = state.viewData;
  if (!state.messages[msgKey]) state.messages[msgKey] = [];
  state.messages[msgKey].push({ userId: state.currentUser.id, text, time: Date.now() });
  saveState();
  input.value = '';
  renderContent();
}

function createGeneralClass() {
  const name = prompt('Year class name (e.g. Year 9):');
  if (!name || !name.trim()) return;
  const icon = prompt('Pick an icon (e.g. 📢):') || '📢';
  const cls = {
    id: 'c' + Date.now(), schoolId: state.currentSchool.id,
    name: name.trim(), icon, type: 'general',
    code: 'CLASS-' + Math.floor(1000 + Math.random() * 9000),
    teacherId: state.currentUser.id, students: []
  };
  state.classes.push(cls);
  saveState();
  toast('Year class created!', 'success');
  renderApp();
}

function createSpecificClass() {
  const name = prompt('Class name (e.g. Maths Period 3):');
  if (!name || !name.trim()) return;
  const icon = prompt('Pick an icon (e.g. 📐):') || '📐';
  const cls = {
    id: 'c' + Date.now(), schoolId: state.currentSchool.id,
    name: name.trim(), icon, type: 'specific',
    code: 'CLASS-' + Math.floor(1000 + Math.random() * 9000),
    teacherId: state.currentUser.id, students: []
  };
  state.classes.push(cls);
  saveState();
  toast('Class created! Share the code with students: ' + cls.code, 'success');
  renderApp();
}

function joinSpecificClass(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;
  const code = prompt('Enter the class code from your teacher:');
  if (!code) return;
  if (code.trim().toUpperCase() !== cls.code) { toast('Incorrect class code', 'error'); return; }
  if (!cls.students) cls.students = [];
  cls.students.push(state.currentUser.id);
  saveState();
  toast('Joined ' + cls.name + '!', 'success');
  renderApp();
}

function createGroup() {
  const name = prompt('Study group name:');
  if (!name || !name.trim()) return;
  const icon = prompt('Pick an icon (e.g. 🔬):') || '👥';
  const g = {
    id: 'g' + Date.now(), schoolId: state.currentSchool.id,
    name: name.trim(), icon, ownerId: state.currentUser.id,
    members: [state.currentUser.id]
  };
  state.groups.push(g);
  saveState();
  toast('Study group created!', 'success');
  renderApp();
}

document.querySelectorAll('.role-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.loginRole = btn.dataset.role;
  });
});

showLogin();
</script>
</body>
</html>
